<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acordate</title>
<meta name="description" content="Tu compañero que no se olvida de nada: medicación, citas, pruebas médicas, pagos y cumpleaños.">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Acordate">
<style>
:root{--bg:#f5f3ee;--card:#fff;--txt:#1b1e23;--sub:#5d6370;--line:#e4e0d6;--pri:#0f766e;--sobrePri:#fff;--priSuave:#e3f4f1;--peligro:#c92a2a;--ok:#2b8a3e;--aviso:#d9480f;--sombra:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.06);--fs:17px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111316;--card:#1b1e23;--txt:#eceef1;--sub:#a5abb6;--line:#2c3038;--pri:#2dd4bf;--sobrePri:#062b27;--priSuave:#13332f;--peligro:#ff6b6b;--ok:#51cf66;--aviso:#ff922b;--sombra:none;color-scheme:dark}}
:root[data-theme=dark]{--bg:#111316;--card:#1b1e23;--txt:#eceef1;--sub:#a5abb6;--line:#2c3038;--pri:#2dd4bf;--sobrePri:#062b27;--priSuave:#13332f;--peligro:#ff6b6b;--ok:#51cf66;--aviso:#ff922b;--sombra:none;color-scheme:dark}
:root[data-letra=grande]{--fs:20px}:root[data-letra=enorme]{--fs:23px}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:760px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header.cab{padding:calc(18px + env(safe-area-inset-top)) 0 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
header.cab h1{margin:0;font-size:1.55rem;letter-spacing:-.02em}
header.cab p{margin:2px 0 0;color:var(--sub);font-size:.9rem}
.marca{display:flex;align-items:center;gap:8px;color:var(--pri);font-weight:700;font-size:.85rem}
.marca svg{width:26px;height:26px}
.tarjeta{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--sombra);margin:12px 0}
.tarjeta h2{margin:0 0 8px;font-size:1.05rem}
.sub{color:var(--sub);font-size:.88rem}
.rapido{display:flex;gap:8px;align-items:center}
.rapido input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;outline:none}
.rapido input:focus{border-color:var(--pri)}
.btn{border:0;border-radius:14px;padding:12px 16px;background:var(--pri);color:var(--sobrePri);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px}
.btn.sec{background:var(--priSuave);color:var(--txt)}
.btn.peligro{background:transparent;color:var(--peligro);border:1.5px solid var(--peligro)}
.btn.ancho{width:100%}
.btn-ico{width:46px;height:46px;border-radius:14px;border:0;background:var(--priSuave);display:grid;place-items:center;flex:none}
.btn-ico svg{width:22px;height:22px}
.btn-ico.escuchando{background:var(--peligro);color:#fff;animation:latido 1s infinite}
@keyframes latido{50%{transform:scale(1.08)}}
.ejemplos{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ejemplos button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:.82rem;color:var(--sub)}
.progreso{display:flex;align-items:center;gap:14px}
.anillo{width:64px;height:64px;flex:none}
.anillo circle{fill:none;stroke-width:7}
.anillo .fondo{stroke:var(--line)}.anillo .valor{stroke:var(--pri);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .5s}
.anillo text{font-size:15px;font-weight:700;fill:var(--txt)}
ul.lista{list-style:none;margin:0;padding:0}
.fila{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.fila:first-child{border-top:0}
.fila .hora{font-variant-numeric:tabular-nums;font-weight:700;width:3.1em;flex:none}
.fila .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);flex:none;font-size:1.15rem}
.fila .cuerpo{flex:1;min-width:0;cursor:pointer}
.fila .cuerpo b{display:block;font-weight:600;overflow-wrap:anywhere}
.fila .cuerpo small{display:block;color:var(--sub);font-size:.82rem}
.estado{display:inline-block;margin-top:3px;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--sub)}
.fila.hecho .cuerpo b{text-decoration:line-through;color:var(--sub)}
.fila.hecho .estado{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.fila.atrasada .estado{background:color-mix(in srgb,var(--aviso) 18%,transparent);color:var(--aviso)}
.fila.saltado{opacity:.6}
.acc{display:flex;gap:6px;flex:none}
.btn-ok{width:46px;height:46px;border-radius:50%;border:2px solid var(--pri);background:transparent;color:var(--pri);font-size:1.2rem;font-weight:700}
.btn-ok:active{background:var(--pri);color:var(--sobrePri)}
.btn-mini{width:40px;height:46px;border:0;background:transparent;color:var(--sub);font-size:1.25rem;border-radius:12px}
.vacio{text-align:center;padding:18px 6px;color:var(--sub)}
.vacio .grande{font-size:2.2rem}
.aviso-card{border-left:5px solid var(--aviso)}
.aviso-card.info{border-left-color:var(--pri)}
.dia-tit{margin:18px 4px 4px;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font-size:.88rem;min-height:40px}
.chip.on{border-color:var(--pri);background:var(--priSuave);font-weight:600}
.puntos{display:flex;gap:4px;margin-top:6px}
.puntos span{width:14px;height:14px;border-radius:50%;background:var(--line)}
.puntos .si{background:var(--ok)}.puntos .no{background:var(--aviso)}.puntos .parcial{background:color-mix(in srgb,var(--ok) 45%,var(--aviso))}
.medidor{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.medidor i{display:block;height:100%;background:var(--pri)}
.medidor.bajo i{background:var(--aviso)}
.fila-ajuste{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.fila-ajuste:first-of-type{border-top:0}
.fila-ajuste select,.fila-ajuste input[type=time],.fila-ajuste input[type=text]{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 10px;max-width:55%}
.interruptor{appearance:none;width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:.2s}
.interruptor::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.interruptor:checked{background:var(--pri)}.interruptor:checked::after{left:25px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.tabs div{display:flex;max-width:760px;width:100%;justify-content:space-around}
nav.tabs button{flex:1;border:0;background:none;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;padding:6px 0;border-radius:12px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--pri);font-weight:700}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(84px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:20px;border:0;background:var(--pri);color:var(--sobrePri);box-shadow:0 8px 24px rgba(15,118,110,.4);display:grid;place-items:center;z-index:6}
.fab svg{width:30px;height:30px}
dialog{border:0;border-radius:22px;padding:0;background:var(--card);color:var(--txt);width:min(560px,calc(100vw - 20px));max-height:calc(100dvh - 30px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,12,15,.5)}
.dlg-cab{position:sticky;top:0;background:var(--card);padding:16px 18px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);z-index:1}
.dlg-cab h2{margin:0;font-size:1.15rem}
.dlg-cuerpo{padding:14px 18px 18px}
.campo{margin:0 0 14px}
.campo>label,.campo>.etq{display:block;font-weight:600;font-size:.88rem;margin-bottom:6px}
.campo input:not([type=checkbox]),.campo select,.campo textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;outline:none}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--pri)}
.campo textarea{min-height:70px;resize:vertical}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.horas{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.horas .h{display:flex;align-items:center;border:1.5px solid var(--pri);border-radius:12px;background:var(--priSuave)}
.horas .h input{border:0!important;background:transparent!important;width:auto!important;padding:8px!important}
.horas .h button{border:0;background:none;padding:0 10px 0 2px;font-size:1.1rem;color:var(--sub)}
.botonera{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.botonera .btn{flex:1 1 140px}
.nota{font-size:.8rem;color:var(--sub);margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--txt);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:calc(100vw - 32px);text-align:center}
.toast.ver{opacity:1;transform:translateX(-50%)}
.alerta-ico{font-size:3rem;text-align:center}
.alerta h3{text-align:center;margin:6px 0;font-size:1.3rem}
.alerta p{text-align:center;color:var(--sub);margin:0 0 16px}
#bloqueo{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:100;padding:16px}
#bloqueo[hidden]{display:none}
#bloqueo .caja{width:min(360px,100%);text-align:center}
#bloqueo input{width:100%;text-align:center;font-size:1.6rem;letter-spacing:.4em;border:1.5px solid var(--line);border-radius:14px;padding:12px;background:var(--card);margin:16px 0 10px}
.err{color:var(--peligro);min-height:1.4em;font-size:.9rem}
.buscar{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:11px 14px;margin-top:8px}
.grupo-tit{display:flex;align-items:center;gap:8px;margin:0 0 4px;font-size:1rem}
.pausado{opacity:.5}
.etiqueta{font-size:.72rem;padding:2px 7px;border-radius:99px;background:var(--line);color:var(--sub);font-weight:600;margin-left:4px;vertical-align:middle}
.oculto{display:none!important}
a{color:var(--pri)}
@media (max-width:380px){.fila .hora{width:2.8em;font-size:.9rem}.fila .ico{display:none}}
</style>
</head>
<body>
<div id="bloqueo" hidden>
  <form class="caja" id="fBloqueo">
    <div class="marca" style="justify-content:center"><svg viewBox="0 0 64 64"><use href="#logo"/></svg>Acordate</div>
    <h2 style="margin:18px 0 0">Introduce tu PIN</h2>
    <p class="sub">Tus datos están cifrados en este dispositivo.</p>
    <input id="pinBloqueo" type="password" inputmode="numeric" autocomplete="current-password" aria-label="PIN" required>
    <div class="err" id="errBloqueo"></div>
    <button class="btn ancho" type="submit">Desbloquear</button>
  </form>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="currentColor"/><path d="M32 13c-8 0-13.5 6-13.5 13.6v8.2L14 41.5h36l-4.5-6.7v-8.2C45.5 19 40 13 32 13z" fill="#fff"/><path d="M26.5 46.5a5.5 5.5 0 0 0 11 0" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/><path d="M25.5 28.5l4.6 4.6 8.4-8.6" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<div class="app">
  <header class="cab">
    <div><div class="marca"><svg viewBox="0 0 64 64"><use href="#logo"/></svg>Acordate</div><h1 id="titulo">Hoy</h1><p id="subtitulo"></p></div>
  </header>
  <main id="vista"></main>
</div>

<button class="fab" id="fab" aria-label="Añadir recordatorio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<nav class="tabs" aria-label="Secciones"><div>
  <button data-vista="hoy" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hoy</button>
  <button data-vista="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Agenda</button>
  <button data-vista="medicinas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2.5" y="8" width="19" height="8" rx="4" transform="rotate(-35 12 12)"/><path d="M9.7 8.7l4.6 6.6"/></svg>Medicinas</button>
  <button data-vista="todo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Todo</button>
  <button data-vista="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
</div></nav>

<dialog id="dlgForm"><div class="dlg-cab"><h2 id="formTit">Nuevo recordatorio</h2><button class="btn-mini" data-cerrar aria-label="Cerrar">✕</button></div><div class="dlg-cuerpo" id="formCuerpo"></div></dialog>
<dialog id="dlgMenu"><div class="dlg-cab"><h2 id="menuTit"></h2><button class="btn-mini" data-cerrar aria-label="Cerrar">✕</button></div><div class="dlg-cuerpo" id="menuCuerpo"></div></dialog>
<dialog id="dlgAlerta"><div class="dlg-cuerpo alerta" id="alertaCuerpo"></div></dialog>
<dialog id="dlgPedir"><form method="dialog" id="fPedir"><div class="dlg-cab"><h2 id="pedirTit"></h2></div><div class="dlg-cuerpo"><p class="sub" id="pedirTxt"></p><div class="campo"><input id="pedirIn" autocomplete="off"></div><div class="botonera"><button class="btn sec" value="no" type="button" id="pedirNo">Cancelar</button><button class="btn" value="si" type="submit">Aceptar</button></div></div></form></dialog>
<dialog id="dlgFicha"><div class="dlg-cab"><h2>Mi ficha de salud</h2><button class="btn-mini" data-cerrar aria-label="Cerrar">✕</button></div><div class="dlg-cuerpo" id="fichaCuerpo"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="archivo" accept=".json,application/json" hidden>

<script>
'use strict';
/* ===== Utilidades ===== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const deYmd=s=>{const[a,m,d]=s.split('-').map(Number);return new Date(a,m-1,d)};
const conHora=(f,h)=>{const d=deYmd(f),[hh,mm]=h.split(':').map(Number);d.setHours(hh,mm,0,0);return d};
const sumarDias=(f,n)=>{const d=deYmd(f);d.setDate(d.getDate()+n);return ymd(d)};
const diasEntre=(a,b)=>Math.round((deYmd(b)-deYmd(a))/864e5);
const hoy=()=>ymd(new Date());
const horaDe=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const sinTildes=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const DIAS_L=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
const DIAS_C=['L','M','X','J','V','S','D'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const diaSem=d=>((d.getDay()+6)%7)+1;
const fechaLarga=f=>{const d=deYmd(f);return `${DIAS_L[diaSem(d)-1]} ${d.getDate()} de ${MESES[d.getMonth()]}`};
function relDia(f){const n=diasEntre(hoy(),f);if(n===0)return 'Hoy';if(n===1)return 'Mañana';if(n===2)return 'Pasado mañana';if(n===-1)return 'Ayer';if(n>2&&n<7)return cap(DIAS_L[diaSem(deYmd(f))-1]);return cap(fechaLarga(f))}

const TIPOS={
  med:{n:'Medicamento',i:'💊',c:'#e8590c',avisos:[]},
  cita:{n:'Cita o reunión',i:'📅',c:'#1c7ed6',avisos:[60,1440]},
  prueba:{n:'Prueba médica',i:'🩺',c:'#c2255c',avisos:[120,1440]},
  tarea:{n:'Tarea',i:'✅',c:'#2b8a3e',avisos:[]},
  pago:{n:'Pago o recibo',i:'💶',c:'#7048e8',avisos:[1440]},
  cumple:{n:'Cumpleaños',i:'🎂',c:'#d6336c',avisos:[1440]},
  otro:{n:'Otro',i:'🔔',c:'#5c677d',avisos:[]}
};
const AVISOS=[[5,'5 min'],[15,'15 min'],[30,'30 min'],[60,'1 hora'],[120,'2 horas'],[1440,'1 día'],[2880,'2 días'],[10080,'1 semana']];
const antelacion=m=>m>=10080?'Dentro de una semana':m>=2880?`Dentro de ${Math.round(m/1440)} días`:m>=1440?'Mañana':m>=60?`Dentro de ${m/60===1?'una hora':Math.round(m/60)+' horas'}`:`Dentro de ${m} minutos`;

/* ===== Almacenamiento cifrado ===== */
const CLAVE='acordate.v1';
let S=null, sesion=null;
const nuevoEstado=()=>({items:[],reg:{},avisados:{},ajustes:{nombre:'',resumen:'08:00',insistir:true,letra:'normal',tema:'auto',sinInstalar:false},ficha:{}});
const migrar=s=>{const b=nuevoEstado();return {...b,...s,ajustes:{...b.ajustes,...(s.ajustes||{})},ficha:s.ficha||{}}};
const b64=buf=>{const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)};
const deB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

function ocurre(it,f){

  const d=deYmd(f),i=deYmd(it.inicio);
  switch(it.rep){
    case 'una':return f===it.inicio;
    case 'diaria':return true;
    case 'cadaN':return diasEntre(it.inicio,f)%(+it.cadaN||1)===0;
    case 'semanal':return (it.dias||[]).includes(diaSem(d));

  }return false}
function ocurrencias(f,items=S.items){const r=[];for(const it of items)if(ocurre(it,f))for(const h of it.horas)r.push({it,f,h,k:`${it.id}|${f}|${h}`,t:conHora(f,h)});return r.sort((a,b)=>a.t-b.t)}
function proxima(it){const ahora=Date.now();for(let n=0;n<800;n++){const f=sumarDias(hoy(),n);if(it.fin&&f>it.fin)break;if(ocurre({...it,pausado:false},f))for(const h of it.horas){const t=conHora(f,h);if(t>ahora)return {f,h,t}}}return null}

    for(const m of new Set([0,...(it.avisos||[])]))res.push({oc,t:base-m*6e4,m,tag:`${oc.k}|${m}`});
    if(it.prepTexto&&+it.prepHoras>0)res.push({oc,t:base-it.prepHoras*36e5,m:'prep',tag:`${oc.k}|prep`});

    if(S.ajustes.insistir&&(it.tipo==='med'||it.insistir)&&!reg)for(const n of [15,40])res.push({oc,t:base+n*6e4,m:'ins'+n,tag:`${oc.k}|ins${n}`});

  const aHora=(h,m,frac,per)=>{h=+h;m=+(m||0);if(frac){const f=sinTildes(frac);if(f.includes('media'))m=30;else if(f.includes('menos')){h-=1;m=45}else m=15}const p=sinTildes(per||'');if((p.includes('tarde')||p.includes('noche')||p==='pm')&&h<12)h+=12;if(p.includes('mediodia')&&h<5)h+=12;if(!p&&(r.tipo==='cita'||r.tipo==='prueba')&&h>=1&&h<=7)h+=12;if(h===24)h=0;if(h>23||m>59||h<0)return null;return pad(h)+':'+pad(m)};

  saca(/\b(\d{1,2})[/-](\d{1,2})(?:[/-](\d{2,4}))?\b/g,m=>{let a=m[3]?+m[3]:new Date().getFullYear();if(a<100)a+=2000;let f=ymd(new Date(a,+m[2]-1,+m[1]));if(!m[3]&&f<hoy())f=ymd(new Date(a+1,+m[2]-1,+m[1]));fecha=f});

  for(const k in S.avisados)if(S.avisados[k]<ahora-12*864e5){delete S.avisados[k];cambio=true}

const icsF=(f,h)=>f.replace(/-/g,'')+'T'+h.replace(':','')+'00';
const icsTxt=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
function rrule(it){const m={diaria:'FREQ=DAILY',cadaN:`FREQ=DAILY;INTERVAL=${it.cadaN||2}`,semanal:`FREQ=WEEKLY;BYDAY=${(it.dias||[]).map(d=>['MO','TU','WE','TH','FR','SA','SU'][d-1]).join(',')}`,mensual:'FREQ=MONTHLY',anual:'FREQ=YEARLY'}[it.rep];return m?m+(it.fin?`;UNTIL=${it.fin.replace(/-/g,'')}T235959`:''):''}
const detalle=it=>[it.dosis&&'Dosis: '+it.dosis,it.para&&'Para: '+it.para,it.prepTexto&&'Preparación: '+it.prepTexto,it.notas].filter(Boolean).join('\n');
function plegar(l){const o=[];while(l.length>72){o.push(l.slice(0,72));l=' '+l.slice(72)}o.push(l);return o.join('\r\n')}
function ics(items){
  const ahora=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,''),L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Acordate//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  for(const it of items.filter(i=>!i.pausado))for(const h of it.horas){const dur=it.tipo==='med'?'PT15M':'PT1H';
    L.push('BEGIN:VEVENT',`UID:${it.id}-${h.replace(':','')}@acordate`,`DTSTAMP:${ahora}`,`DTSTART:${icsF(it.inicio,h)}`,`DURATION:${dur}`,`SUMMARY:${icsTxt(TIPOS[it.tipo].i+' '+it.titulo)}`);
    if(detalle(it))L.push(`DESCRIPTION:${icsTxt(detalle(it))}`);if(it.lugar)L.push(`LOCATION:${icsTxt(it.lugar)}`);const r=rrule(it);if(r)L.push('RRULE:'+r);
    for(const m of new Set([0,...(it.avisos||[])]))L.push('BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsTxt(it.titulo)}`,`TRIGGER:-PT${m}M`,'END:VALARM');
    if(it.prepTexto&&+it.prepHoras>0)L.push('BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsTxt('Preparación: '+it.prepTexto)}`,`TRIGGER:-PT${+it.prepHoras*60}M`,'END:VALARM');
    L.push('END:VEVENT')}
  L.push('END:VCALENDAR');return L.map(plegar).join('\r\n')}
function enlaceGoogle(it){const h=it.horas[0]||'09:00',ini=conHora(it.inicio,h),fin=new Date(ini.getTime()+(it.tipo==='med'?15:60)*6e4);
  const p=new URLSearchParams({action:'TEMPLATE',text:`${TIPOS[it.tipo].i} ${it.titulo||''}`,dates:`${icsF(it.inicio,h)}/${icsF(ymd(fin),horaDe(fin))}`,details:detalle(it),location:it.lugar||''});
  const r=rrule(it);if(r)p.set('recur','RRULE:'+r);return 'https://calendar.google.com/calendar/render?'+p}
async function entregar(nombre,contenido,tipo){
  const blob=new Blob([contenido],{type:tipo});const file=new File([blob],nombre,{type:tipo});
  if(navigator.canShare?.({files:[file]})&&/android|iphone|ipad/i.test(navigator.userAgent)){try{await navigator.share({files:[file],title:nombre});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nombre;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}

/* ===== Diálogos auxiliares ===== */
function pedirTexto(tit,txt,{tipo='text',modo='text'}={}){return new Promise(res=>{
  const d=$('#dlgPedir'),i=$('#pedirIn');$('#pedirTit').textContent=tit;$('#pedirTxt').textContent=txt;i.type=tipo;i.inputMode=modo;i.value='';
  const fin=v=>{d.onclose=null;$('#pedirNo').onclick=null;if(d.open)d.close();res(v)};
  $('#pedirNo').onclick=()=>fin(null);d.onclose=()=>fin(d.returnValue==='si'?i.value:null);d.returnValue='';d.showModal();setTimeout(()=>i.focus(),50)})}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('ver');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('ver'),2600)}
async function pedirPermiso(){if(!('Notification' in window))return toast('Este navegador no admite avisos');const p=await Notification.requestPermission();render();if(p==='granted'){toast('¡Avisos activados!');avisar('🔔 Así te avisaré','Cuando llegue la hora de cada cosa, aparecerá un aviso como este.','prueba|'+Date.now(),null)}}
function abrirMenu(k){const it=itemDeK(k);if(!it)return;$('#menuTit').textContent=it.titulo;
  $('#menuCuerpo').innerHTML=`<div class="botonera" style="flex-direction:column"><button class="btn sec ancho" data-pos="${k}|10" data-cerrar>⏰ Recuérdamelo en 10 minutos</button><button class="btn sec ancho" data-pos="${k}|30" data-cerrar>⏰ En 30 minutos</button><button class="btn sec ancho" data-pos="${k}|60" data-cerrar>⏰ En 1 hora</button><button class="btn sec ancho" data-saltar="${k}" data-cerrar>Saltar esta vez</button><button class="btn sec ancho" data-editar="${it.id}" data-cerrar>Editar recordatorio</button></div>`;$('#dlgMenu').showModal()}
function abrirFicha(){const f=S.ficha,c=(n,ph)=>`<input data-ficha="${n}" value="${esc(f[n]||'')}" placeholder="${ph}">`;
  $('#fichaCuerpo').innerHTML=`<div class="campo"><label>Alergias</label>${c('alergias','Ej.: penicilina')}</div><div class="campo"><label>Enfermedades o condiciones</label>${c('enfermedades','Ej.: hipertensión, diabetes tipo 2')}</div><div class="dos"><div class="campo"><label>Grupo sanguíneo</label>${c('grupo','Ej.: A+')}</div><div class="campo"><label>Tarjeta sanitaria</label>${c('tarjeta','Número')}</div></div><div class="campo"><label>Médico de cabecera</label>${c('medico','Nombre y teléfono')}</div><div class="campo"><label>Contacto de emergencia</label>${c('emergencia','Nombre y teléfono')}</div><div class="campo"><label>Otros datos</label><textarea data-ficha="otros" placeholder="Operaciones, prótesis, seguro médico…">${esc(f.otros||'')}</textarea></div><p class="nota">${sesion?'🔒 Se guarda cifrada con tu PIN.':'Consejo: pon un PIN en Ajustes para cifrar esta ficha.'}</p><div class="botonera"><button class="btn" data-cerrar>Listo</button></div>`;$('#dlgFicha').showModal()}

/* ===== Copias, PIN, borrado ===== */
async function exportar(){
  const p=await pedirTexto('Contraseña de la copia','Elige una contraseña para cifrar la copia. Te la pedirá al cargarla en el otro dispositivo.',{tipo:'password'});
  if(p==null)return;if(p.length<4)return toast('Mínimo 4 caracteres');
  const salt=crypto.getRandomValues(new Uint8Array(16)),key=await derivar(p,salt),paq=await cifrar({items:S.items,reg:S.reg,ficha:S.ficha,ajustes:S.ajustes},key,salt);
  await entregar(`acordate-copia-${hoy()}.json`,JSON.stringify(paq),'application/json');toast('Copia creada')}
async function importar(file){
  try{const paq=JSON.parse(await file.text());if(paq.app!=='acordate')throw new Error('No es una copia de Acordate');
    let datos=paq.data;if(paq.cifrado){const p=await pedirTexto('Contraseña de la copia','Escribe la contraseña con la que se creó la copia.',{tipo:'password'});if(p==null)return;datos=(await descifrar(paq,p)).obj}
    const porId=new Map(S.items.map(i=>[i.id,i]));for(const it of datos.items||[])porId.set(it.id,it);S.items=[...porId.values()];
    S.reg={...(datos.reg||{}),...S.reg};S.ficha={...(datos.ficha||{}),...Object.fromEntries(Object.entries(S.ficha).filter(([,v])=>v))};
    if(!S.ajustes.nombre&&datos.ajustes?.nombre)S.ajustes.nombre=datos.ajustes.nombre;
    marcarPasadas();await guardar();render();toast(`Copia cargada: ${(datos.items||[]).length} recordatorios`)}
  catch(e){toast(e.name==='OperationError'?'Contraseña incorrecta':'No se ha podido cargar: '+e.message)}}
async function gestionarPin(){
  if(sesion){const q=await pedirTexto('PIN','Escribe un PIN nuevo para cambiarlo, o déjalo vacío para quitarlo.',{tipo:'password',modo:'numeric'});if(q==null)return;
    if(q===''){sesion=null;await guardar();render();return toast('PIN quitado. Los datos ya no van cifrados')}return ponerPin(q)}
  const p=await pedirTexto('Nuevo PIN','Mínimo 4 cifras. Si lo olvidas no se pueden recuperar los datos (salvo con una copia).',{tipo:'password',modo:'numeric'});if(p!=null)ponerPin(p)}
async function ponerPin(p){if(p.length<4)return toast('Mínimo 4 cifras');const r=await pedirTexto('Repite el PIN','Para comprobar que no hay errores.',{tipo:'password',modo:'numeric'});if(r!==p)return toast('No coinciden');
  const salt=crypto.getRandomValues(new Uint8Array(16));sesion={key:await derivar(p,salt),salt};await guardar();render();toast('🔒 PIN puesto: datos cifrados')}
async function borrarTodo(){const r=await pedirTexto('¿Borrar todo?','Se borrarán todos tus recordatorios y tu ficha de este dispositivo. Escribe BORRAR para confirmar.');if(r?.trim().toUpperCase()!=='BORRAR')return;localStorage.removeItem(CLAVE);sesion=null;S=nuevoEstado();render();toast('Datos borrados')}

/* ===== Voz ===== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function dictar(btn){const rec=new SR();rec.lang='es-ES';rec.interimResults=true;rec.maxAlternatives=1;btn.classList.add('escuchando');
  rec.onresult=e=>{const txt=[...e.results].map(r=>r[0].transcript).join('');$('#inRapido').value=txt;if(e.results[e.results.length-1].isFinal){rec.stop();abrirForm(interpretar(txt))}};
  rec.onerror=e=>{toast(e.error==='not-allowed'?'Permite el micrófono para dictar':'No te he entendido, prueba otra vez')};rec.onend=()=>btn.classList.remove('escuchando');rec.start()}

/* ===== Eventos ===== */
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-editar],a');if(!b)return;const d=b.dataset;
  if(d.vista){vista=d.vista;render();scrollTo(0,0);return}
  if(d.hecho)marcar(d.hecho,'hecho');
  else if(d.deshacer)deshacer(d.deshacer);
  else if(d.menu)abrirMenu(d.menu);
  else if(d.pos){const p=d.pos.split('|');posponer(p.slice(0,3).join('|'),+p[3])}
  else if(d.saltar)marcar(d.saltar,'saltado');
  else if(d.ejemplo){abrirForm(interpretar(d.ejemplo))}
  else if(d.nuevo)abrirForm({tipo:d.nuevo,avisos:[...TIPOS[d.nuevo].avisos],rep:d.nuevo==='med'?'diaria':'una'});
  else if(d.meds!=null){verMedsAgenda=d.meds==='1';render()}
  else if(d.reponer)reponer(d.reponer);
  else if(d.tipo&&F){const nuevo=!F.id;F.tipo=d.tipo;if(nuevo)F.avisos=[...TIPOS[d.tipo].avisos];if(d.tipo==='med'&&F.rep==='una'&&nuevo)F.rep='diaria';if(d.tipo==='cumple'&&nuevo)F.rep='anual';pintarForm()}
  else if(d.dia&&F){const x=+d.dia;F.dias=F.dias.includes(x)?F.dias.filter(y=>y!==x):[...F.dias,x].sort();pintarForm()}
  else if(d.aviso&&F){const x=+d.aviso;F.avisos=F.avisos.includes(x)?F.avisos.filter(y=>y!==x):[...F.avisos,x].sort((a,b)=>a-b);pintarForm()}
  else if(d.quitarhora!=null&&F){F.horas.splice(+d.quitarhora,1);pintarForm()}
  else if(d.editar&&!b.closest('#dlgForm')){const it=S.items.find(i=>i.id===d.editar);if(it){if(d.cerrar!=null)b.closest('dialog')?.close();abrirForm(it)}return}
  const id=b.id;
  if(id==='fab')abrirForm();
  else if(id==='masHora'){const u=F.horas[F.horas.length-1]||'09:00',[h,m]=u.split(':').map(Number);F.horas.push(pad((h+4)%24)+':'+pad(m));pintarForm()}
  else if(id==='btnGuardar')guardarForm();
  else if(id==='btnEliminar'){if(confirm(`¿Eliminar «${F.titulo}»?`)){S.items=S.items.filter(i=>i.id!==F.id);for(const k in S.reg)if(k.startsWith(F.id+'|'))delete S.reg[k];guardar();$('#dlgForm').close();render();toast('Eliminado')}}
  else if(id==='btnIcs'){const it=S.items.find(i=>i.id===F.id);if(it)entregar(`${it.titulo.replace(/[^\wáéíóúñü -]/gi,'').slice(0,40)||'recordatorio'}.ics`,ics([it]),'text/calendar')}
  else if(id==='btnIcsTodo'){if(!S.items.length)return toast('Aún no hay recordatorios');entregar(`acordate-${hoy()}.ics`,ics(S.items),'text/calendar')}
  else if(id==='btnPermiso')pedirPermiso();
  else if(id==='btnProbar')avisar('🔔 Prueba de aviso','Si ves esto, los avisos funcionan.','prueba|'+Date.now(),null);
  else if(id==='btnInstalar'&&promptInstalar){promptInstalar.prompt();promptInstalar.userChoice.finally(()=>{promptInstalar=null;render()})}
  else if(id==='btnNoInstalar'){S.ajustes.sinInstalar=true;guardar();render()}
  else if(id==='btnFicha')abrirFicha();
  else if(id==='btnPin')gestionarPin();
  else if(id==='btnExportar')exportar();
  else if(id==='btnImportar')$('#archivo').click();
  else if(id==='btnBorrar')borrarTodo();
  else if(id==='btnVoz')dictar(b);
  else if(id==='btnCompartir'){const url=location.origin+location.pathname,txt='Te recomiendo Acordate: un compañero que te recuerda medicinas, citas y todo lo importante. Se instala desde este enlace y tus datos se quedan solo en tu móvil.';
    if(navigator.share)navigator.share({title:'Acordate',text:txt,url}).catch(()=>{});else{navigator.clipboard?.writeText(txt+' '+url);toast('Enlace copiado')}}
  if(d.cerrar!=null)b.closest('dialog')?.close()});
async function reponer(id){const it=S.items.find(i=>i.id===id);if(!it)return;const v=await pedirTexto(it.stock!=null?'¿Cuántas unidades has añadido?':'¿Cuántas unidades tienes?',it.titulo,{tipo:'number',modo:'numeric'});if(v==null||v===''||isNaN(+v))return;it.stock=(it.stock!=null&&it.stock!==''?+it.stock:0)+(+v);guardar();render();toast(`Ahora tienes ${it.stock} unidades`)}
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;
  if(d.f&&F){F[d.f]=t.value;if(d.f==='rep')pintarForm()}
  else if(d.hora!=null&&F)F.horas[+d.hora]=t.value;
  else if(d.ficha){S.ficha[d.ficha]=t.value;guardar()}
  else if(t.id==='inBuscar'){filtroTodo=t.value;render()}
  else if(d.aj){S.ajustes[d.aj]=t.type==='checkbox'?t.checked:t.value;guardar();aplicarApariencia();if(d.aj==='resumen')delete S.avisados['resumen|'+hoy()]}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
  if(d.pausar){const it=S.items.find(i=>i.id===d.pausar);it.pausado=!t.checked;if(!it.pausado)marcarPasadas(it.id);guardar();render()}
  else if(d.aj==='insistir'){S.ajustes.insistir=t.checked;guardar()}
  else if(t.id==='archivo'&&t.files[0]){importar(t.files[0]);t.value=''}});
document.addEventListener('submit',e=>{if(e.target.id==='fRapido'){e.preventDefault();const v=$('#inRapido').value.trim();if(!v)return abrirForm();abrirForm(interpretar(v));$('#inRapido').value=''}});
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d&&d.id!=='dlgPedir')d.close()}));
addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptInstalar=e;render()});
addEventListener('appinstalled',()=>{promptInstalar=null;toast('¡Instalada!');render()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){revisar();render()}});

/* ===== Arranque ===== */
function procesarAccion(accion,k){if(!k||!S)return;if(accion==='hecho')marcar(k,'hecho');else if(accion==='posponer')posponer(k,10);else{vista='hoy';render()}}
async function iniciar(){
  aplicarApariencia();render();
  if('serviceWorker' in navigator&&isSecureContext){try{regSW=await navigator.serviceWorker.register('sw.js');navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.tipo==='accion')procesarAccion(e.data.accion,e.data.k)})}catch(e){}}
  navigator.storage?.persist?.().catch(()=>{});
  const q=new URLSearchParams(location.search);if(q.get('k')){procesarAccion(q.get('accion'),q.get('k'));history.replaceState(null,'',location.pathname)}
  const hoyF=hoy();for(const k in S.reg)if(k.split('|')[1]<sumarDias(hoyF,-120))delete S.reg[k];
  revisar();setInterval(revisar,20000);
  let dia=hoyF;setInterval(()=>{if(hoy()!==dia){dia=hoy();render()}},60000)}
let fallos=0;
$('#fBloqueo').addEventListener('submit',async e=>{e.preventDefault();const pin=$('#pinBloqueo').value;try{const paq=JSON.parse(localStorage.getItem(CLAVE));const r=await descifrar(paq,pin);S=migrar(r.obj);sesion={key:r.key,salt:r.salt};$('#bloqueo').hidden=true;$('#pinBloqueo').value='';iniciar()}
  catch(_){fallos++;$('#errBloqueo').textContent='PIN incorrecto';const b=e.target.querySelector('button');b.disabled=true;setTimeout(()=>b.disabled=false,Math.min(30000,fallos*fallos*500));$('#pinBloqueo').value=''}});
(function arrancar(){let paq=null;try{paq=JSON.parse(localStorage.getItem(CLAVE)||'null')}catch(_){}
  if(paq?.cifrado){$('#bloqueo').hidden=false;setTimeout(()=>$('#pinBloqueo').focus(),50);return}
  S=paq?.data?migrar(paq.data):nuevoEstado();iniciar()})();
window.__acordate={interpretar,ocurrencias,ics,get S(){return S}};
